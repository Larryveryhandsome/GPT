name: Validate official website entry
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check entry and preserve the configured Pages source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8-sig')
          assert 'https://larryveryhandsome.github.io/GPT/moomoo/' in html
          assert 'mooResident' in html and '原始備份' in html
          assert chr(0x8ce3) not in html
          print('Official entry and legacy backup checks passed. No Pages deployment performed.')
          PY
